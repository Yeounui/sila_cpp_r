syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.silastandard.core.authorizationconfigurationservice.v1;

/* This Feature exposes the server configuration which authorization provider to use. */
service AuthorizationConfigurationService {
    /* Instructs the server to use the given authorization provider starting from the next request. */
    rpc SetAuthorizationProvider(sila2.org.silastandard.core.authorizationconfigurationservice.v1.SetAuthorizationProvider_Parameters) returns (sila2.org.silastandard.core.authorizationconfigurationservice.v1.SetAuthorizationProvider_Responses) {}
    /* The UUID of the SiLA server that this server uses to verify access tokens. */
    rpc Get_AuthorizationProvider(sila2.org.silastandard.core.authorizationconfigurationservice.v1.Get_AuthorizationProvider_Parameters) returns (sila2.org.silastandard.core.authorizationconfigurationservice.v1.Get_AuthorizationProvider_Responses) {}
}

/* Parameters for SetAuthorizationProvider */
message SetAuthorizationProvider_Parameters {
    sila2.org.silastandard.String AuthorizationProvider = 1;  /* The UUID of the SiLA server that this server uses to verify access tokens. */
}

/* Responses of SetAuthorizationProvider */
message SetAuthorizationProvider_Responses {
}

/* Parameters for Get_AuthorizationProvider */
message Get_AuthorizationProvider_Parameters {
}

/* Responses of Get_AuthorizationProvider */
message Get_AuthorizationProvider_Responses {
    sila2.org.silastandard.String AuthorizationProvider = 1;  /* The UUID of the SiLA server that this server uses to verify access tokens. */
}
